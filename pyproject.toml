[project]
name = "curitiba-run"
version = "0.1.0"
description = "Infraestrutura de corrida, risco de segurança e desigualdade de acesso ao espaço público em Curitiba"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "h3>=4.1",
    "osmnx>=2.0",
    "networkx>=3.2",
    "esda>=2.5",
    "libpysal>=4.9",
    "spreg>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "folium>=0.16",
    "contextily>=1.6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curitiba_run"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: testes que dependem de acesso à rede (desabilitados na CI)",
]
